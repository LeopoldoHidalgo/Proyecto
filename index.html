<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Tool Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    
    <style>
        :root {
            --rojo-intenso: #8E0D3C;
            --grosella-negra: #1D1842;
            --naranja: #EF3B33;
            --rosa: #FDA1A2;
        }

        body {
            font-family: sans-serif;
            background-color: var(--grosella-negra);
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 450px; background: white; padding: 15px;
            border-radius: 20px; box-sizing: border-box;
        }

        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .icon-btn { background: #f0f0f0; border: none; padding: 12px; border-radius: 12px; font-size: 20px; color: var(--grosella-negra); }

        h2 { text-align: center; margin: 0 0 15px 0; color: var(--grosella-negra); font-size: 1.2rem; }

        #scanner-container {
            display: none; width: 100%; height: 200px; background: black;
            border-radius: 15px; overflow: hidden; margin-bottom: 15px;
        }

        .row { display: flex; gap: 8px; margin-bottom: 12px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        
        label { font-size: 10px; font-weight: bold; color: var(--rojo-intenso); margin-bottom: 4px; text-transform: uppercase; }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; 
            font-size: 16px; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--naranja); }

        .card-info { 
            background: #f1f5f9; padding: 12px; border-radius: 12px; 
            margin-bottom: 12px; border-left: 5px solid var(--grosella-negra); display: none;
        }

        #formAlta { 
            display: none; background: #fff1f1; padding: 12px; 
            border-radius: 12px; border: 2px dashed var(--rosa); margin-bottom: 12px;
        }

        /* TABLA MÓVIL */
        .tabla-contenedor { margin-top: 15px; border-top: 2px solid #eee; }
        .item-lista { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #eee;
        }
        .btn-del { 
            background: #fee2e2; color: #dc2626; border: none; 
            padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px;
        }

        .total-box { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; font-weight: bold; font-size: 1.4rem; color: var(--grosella-negra);
        }

        .btn-print { 
            width: 100%; padding: 15px; background: var(--rojo-intenso); 
            color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px;
        }

        @media print { .top-bar, .row, #formAlta, #scanner-container, .btn-print, .btn-del, label { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="icon-btn" onclick="toggleCamara()"><i class="fa-solid fa-camera"></i></button>
        <div style="display:flex; gap:10px;">
            <button class="icon-btn" onclick="descargarCSV()"><i class="fa-solid fa-download"></i></button>
            <button class="icon-btn" onclick="document.getElementById('inputArchivo').click()"><i class="fa-solid fa-cog"></i></button>
        </div>
    </div>

    <input type="file" id="inputArchivo" style="display:none" accept=".csv" onchange="importarCSV(event)">

    <h2>🛒 Compra / Alta</h2>

    <div id="scanner-container"></div>

    <div class="row">
        <div class="col">
            <label>Proveedor</label>
            <select id="provActual">
                <option>Zorro Abarrotero</option>
                <option>Aurrera</option>
                <option>Walmart</option>
                <option>Coca-Cola</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col" style="flex: 2;">
            <label>Código</label>
            <input type="text" id="buscador" placeholder="Escanear..." inputmode="numeric">
        </div>
        <div class="col">
            <label>Cant.</label>
            <input type="number" id="cantHoy" value="1" inputmode="numeric">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Costo Unitario</label>
            <input type="number" id="precioHoy" placeholder="0.00" inputmode="decimal">
        </div>
    </div>

    <div id="formAlta">
        <label>Nombre del Producto</label>
        <input type="text" id="altaNombre" placeholder="Descripción">
        <label style="margin-top:10px">Precio Venta</label>
        <input type="number" id="altaPublico" placeholder="0.00" inputmode="decimal">
    </div>

    <div id="card" class="card-info">
        <div id="txtNombre" style="font-weight:bold;"></div>
        <div style="display:flex; justify-content: space-between; margin-top:5px;">
            <span id="txtProvAnt" style="font-size:12px; color:gray;"></span>
            <span id="txtCostoAnt" style="font-weight:bold; color:var(--grosella-negra);"></span>
        </div>
        <div id="txtDif" style="font-size:11px; text-align:right;"></div>
    </div>

    <div class="total-box">
        <span>TOTAL</span>
        <span id="sumaTotal">$0.00</span>
    </div>

    <div id="listaTabla" class="tabla-contenedor"></div>

    <button class="btn-print" onclick="window.print()">IMPRIMIR TICKET</button>
</div>

<script>
    const fmt = (n) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n);
    let dbProductos = JSON.parse(localStorage.getItem('db_eleventa')) || [];
    let miLista = [];
    let seleccionado = null;
    let esAlta = false;
    let camaraActiva = false;

    // --- CÁMARA ---
    function toggleCamara() {
        const container = document.getElementById('scanner-container');
        if (camaraActiva) {
            Quagga.stop();
            container.style.display = 'none';
            camaraActiva = false;
        } else {
            container.style.display = 'block';
            Quagga.init({
                inputStream: { name: "Live", type: "LiveStream", target: container, constraints: { facingMode: "environment" } },
                decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader"] }
            }, (err) => {
                if (err) { alert("Error cámara"); return; }
                Quagga.start();
                camaraActiva = true;
            });
        }
    }

    Quagga.onDetected((data) => {
        const code = data.codeResult.code;
        if (code) {
            document.getElementById('buscador').value = code;
            toggleCamara();
            buscarProducto(code);
        }
    });

    // --- NAVEGACIÓN ---
    function buscarProducto(codigo) {
        seleccionado = dbProductos.find(p => p.cod === codigo);
        if (seleccionado) {
            esAlta = false;
            document.getElementById('formAlta').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            document.getElementById('txtNombre').innerText = seleccionado.nombre;
            document.getElementById('txtProvAnt').innerText = "Anterior: " + (seleccionado.proveedor || 'N/A');
            document.getElementById('txtCostoAnt').innerText = fmt(seleccionado.costo);
            document.getElementById('cantHoy').focus();
        } else {
            esAlta = true;
            document.getElementById('card').style.display = 'none';
            document.getElementById('formAlta').style.display = 'block';
            document.getElementById('altaNombre').focus();
        }
    }

    // EVENTOS DE TECLADO (ENTER)
    document.getElementById('buscador').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); buscarProducto(e.target.value); }
    });

    document.getElementById('altaNombre').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); document.getElementById('cantHoy').focus(); }
    });

    document.getElementById('cantHoy').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); document.getElementById('precioHoy').focus(); }
    });

    document.getElementById('precioHoy').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            e.preventDefault();
            if(esAlta) { document.getElementById('altaPublico').focus(); }
            else { agregarItem(); }
        }
    });

    document.getElementById('altaPublico').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); agregarItem(); }
    });

    // --- LÓGICA DE LISTA ---
    function agregarItem() {
        const costo = parseFloat(document.getElementById('precioHoy').value) || 0;
        const cant = parseInt(document.getElementById('cantHoy').value) || 1;
        
        let nombre, cod, venta;

        if (esAlta) {
            cod = document.getElementById('buscador').value;
            nombre = document.getElementById('altaNombre').value.toUpperCase();
            venta = parseFloat(document.getElementById('altaPublico').value) || (costo * 1.3);
            
            const nuevo = { cod, nombre, costo, venta, proveedor: document.getElementById('provActual').value };
            dbProductos.push(nuevo);
            localStorage.setItem('db_eleventa', JSON.stringify(dbProductos));
            seleccionado = nuevo;
        } else {
            nombre = seleccionado.nombre;
            cod = seleccionado.cod;
        }

        miLista.push({ cod, nombre, costo, cant, total: costo * cant });
        renderizar();
        limpiar();
    }

    function renderizar() {
        const lista = document.getElementById('listaTabla');
        const totalTxt = document.getElementById('sumaTotal');
        let totalGral = 0;

        lista.innerHTML = '';
        miLista.forEach((item, index) => {
            totalGral += item.total;
            lista.innerHTML += `
                <div class="item-lista">
                    <div>
                        <div style="font-size:14px; font-weight:bold;">${item.nombre}</div>
                        <div style="font-size:12px; color:gray;">${item.cant} x ${fmt(item.costo)}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div style="font-weight:bold;">${fmt(item.total)}</div>
                        <button class="btn-del" onclick="eliminar(${index})">BORRAR</button>
                    </div>
                </div>`;
        });
        totalTxt.innerText = fmt(totalGral);
    }

    function eliminar(index) {
        miLista.splice(index, 1);
        renderizar();
    }

    function limpiar() {
        document.getElementById('buscador').value = '';
        document.getElementById('cantHoy').value = '1';
        document.getElementById('precioHoy').value = '';
        document.getElementById('altaNombre').value = '';
        document.getElementById('altaPublico').value = '';
        document.getElementById('card').style.display = 'none';
        document.getElementById('formAlta').style.display = 'none';
        seleccionado = null;
        esAlta = false;
        document.getElementById('buscador').focus();
    }

    // --- CSV ---
    function descargarCSV() {
        let csv = "Codigo,Descripcion,PrecioCosto,PrecioVenta,Proveedor\n";
        csv += dbProductos.map(p => `${p.cod},${p.nombre},${p.costo},${p.venta},${p.proveedor}`).join("\n");
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Inventario.csv";
        a.click();
    }

    function importarCSV(event) {
        const lector = new FileReader();
        lector.onload = (e) => {
            const lineas = e.target.result.split("\n").slice(1);
            dbProductos = lineas.map(l => {
                const c = l.split(",");
                return c.length > 2 ? { cod: c[0], nombre: c[1], costo: parseFloat(c[2]), venta: parseFloat(c[3]), proveedor: c[4] } : null;
            }).filter(p => p);
            localStorage.setItem('db_eleventa', JSON.stringify(dbProductos));
            alert("Base cargada.");
        };
        lector.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
