<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos - Business Pro</title>
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
  
  <style>
    /* --- PALETA KIOSKO PRO APLICADA --- */
    :root {
      --color-fondo: #2c3e50;      /* Gris Azulado Oscuro */
      --color-primario: #34495e;   /* Azul Grisáceo */
      --color-acento: #2ecc71;     /* Verde Esmeralda */
      --color-azul: #2980b9;       /* Azul Rey */
      --blanco: #ffffff;
      --error: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--color-fondo);
      color: var(--blanco);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--blanco);
      color: #333;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 { color: var(--color-primario); text-align: center; margin-top: 0; }

    /* --- BUSCADOR Y CÁMARA --- */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="number"], input[type="tel"] {
      flex-grow: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    input:focus { border-color: var(--color-azul); }

    .btn-icon {
      background: var(--color-azul);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    #scanner-container {
      width: 100%;
      height: 250px;
      background: black;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none; /* Se activa con el botón de cámara */
    }

    /* --- TARJETA DE PRODUCTO --- */
    .card {
      background: #f8f9fa;
      border-left: 8px solid var(--color-acento);
      padding: 20px;
      border-radius: 15px;
      margin-top: 10px;
      display: none;
    }

    .card h3 { margin: 0; color: var(--color-primario); }
    .card p { margin: 5px 0; font-weight: bold; color: #666; }
    .precio-highlight { font-size: 24px; color: var(--color-acento); display: block; margin: 10px 0; }

    /* --- BOTONES DE ACCIÓN --- */
    .btn-main {
      width: 100%;
      padding: 15px;
      background: var(--color-acento);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-main:active { transform: scale(0.98); }

    .btn-secundario {
      background: var(--color-primario);
      margin-top: 10px;
    }

    /* --- CONTROLES SUPERIORES --- */
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .gear-btn {
      background: none;
      border: none;
      color: var(--blanco);
      font-size: 24px;
      opacity: 0.5;
      cursor: pointer;
    }

    .oculto { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>Business Manager v2</span>
    <button class="gear-btn" onclick="document.getElementById('inputCSV').click()">⚙️</button>
  </div>
  
  <input type="file" id="inputCSV" style="display:none" accept=".csv" onchange="importarCSV(event)">

  <div class="container">
    <h2>Pedidos e Inventario</h2>

    <div id="scanner-container"></div>

    <div class="search-box">
      <input type="text" id="buscador" placeholder="Escanea o escribe nombre..." onkeypress="manejarEnter(event)">
      <button class="btn-icon" onclick="toggleCamara()">📷</button>
    </div>

    <div id="formAlta" class="oculto">
      <p style="color: var(--color-azul); font-weight: bold;">🆕 PRODUCTO NUEVO</p>
      <input type="text" id="altaNombre" placeholder="Nombre del producto" style="margin-bottom: 10px; width: 93%;">
      <input type="tel" id="altaCosto" placeholder="Costo $" style="width: 93%;">
      <button class="btn-main" onclick="guardarNuevo()">Registrar y Agregar</button>
    </div>

    <div id="card" class="card">
      <h3 id="txtNombre">Nombre del Producto</h3>
      <p id="txtProvAnt">Último Proveedor: N/A</p>
      <span class="precio-highlight" id="txtCostoAnt">$0.00</span>
      
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="number" id="cantHoy" placeholder="Cant." style="width: 70px;">
        <input type="text" id="provHoy" placeholder="Proveedor actual..." style="flex-grow: 1;">
      </div>
      <button class="btn-main" onclick="confirmarPedido()">Agregar a la Lista</button>
    </div>
  </div>

  <script>
    // --- LÓGICA DE DATOS ---
    let dbProductos = JSON.parse(localStorage.getItem('db_eleventa')) || [];
    let camaraActiva = false;

    function manejarEnter(e) {
      if(e.key === "Enter") procesarBusqueda(e.target.value);
    }

    function importarCSV(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = (e) => {
        const contenido = e.target.result;
        const filas = contenido.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
        dbProductos = filas.map(f => {
          const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return {
            cod: c[0].replace(/"/g, '').trim().toLowerCase(),
            nombre: c[1].replace(/"/g, '').trim(),
            costo: parseFloat(c[2].replace(/"/g, '').replace('$', '')) || 0,
            proveedor: c[4] ? c[4].replace(/"/g, '').trim() : ""
          };
        });
        localStorage.setItem('db_eleventa', JSON.stringify(dbProductos));
        alert("Base de datos cargada: " + dbProductos.length + " productos.");
      };
      lector.readAsText(archivo);
    }

    function procesarBusqueda(codigo) {
      const cod = codigo.toLowerCase().trim();
      const p = dbProductos.find(x => x.cod === cod || x.nombre.toLowerCase().includes(cod));
      
      if (p) {
        document.getElementById('formAlta').classList.add('oculto');
        document.getElementById('card').style.display = 'block';
        document.getElementById('txtNombre').innerText = p.nombre;
        document.getElementById('txtCostoAnt').innerText = `$${p.costo.toFixed(2)}`;
        document.getElementById('txtProvAnt').innerText = `ULT. PROV: ${p.proveedor || 'N/A'}`;
        document.getElementById('cantHoy').focus();
      } else {
        document.getElementById('card').style.display = 'none';
        document.getElementById('formAlta').classList.remove('oculto');
        document.getElementById('altaNombre').focus();
      }
    }

    // --- CÁMARA ---
    function toggleCamara() {
      const container = document.getElementById('scanner-container');
      if (camaraActiva) {
        Quagga.stop();
        container.style.display = 'none';
        camaraActiva = false;
      } else {
        container.style.display = 'block';
        Quagga.init({
          inputStream: { name: "Live", type: "LiveStream", target: container, constraints: { facingMode: "environment" } },
          decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, (err) => {
          if (err) { alert("Error cámara"); return; }
          Quagga.start();
          camaraActiva = true;
        });
      }
    }

    Quagga.onDetected((data) => {
      const code = data.codeResult.code;
      document.getElementById('buscador').value = code;
      toggleCamara();
      procesarBusqueda(code);
    });

    function confirmarPedido() {
      alert("Producto agregado a la lista de pedidos");
      restablecer();
    }

    function guardarNuevo() {
      alert("Producto nuevo guardado en la base de datos");
      restablecer();
    }

    function restablecer() {
      document.getElementById('card').style.display = 'none';
      document.getElementById('formAlta').classList.add('oculto');
      document.getElementById('buscador').value = "";
      document.getElementById('buscador').focus();
    }
  </script>
</body>
</html>
