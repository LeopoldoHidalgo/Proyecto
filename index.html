<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Precios - Business Tool</title>
  
  <style>
    /* --- PALETA DE COLORES CORPORATIVA --- */
    :root {
      --color-fondo: #2c3e50;      /* Gris Azulado Oscuro */
      --color-primario: #34495e;   /* Azul Grisáceo */
      --color-acento: #2ecc71;     /* Verde Esmeralda (Precios) */
      --color-azul: #2980b9;       /* Azul Rey (Botones/Bordes) */
      --color-texto: #333;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--grosella-negra);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL */
    .kiosko-container {
      width: 90%;
      max-width: 850px;
      background: var(--blanco);
      padding: 60px;
      border-radius: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
      text-align: center;
      box-sizing: border-box;
    }

    h1 { color: var(--grosella-negra); font-size: 4rem; margin: 0; font-weight: 900; letter-spacing: -2px; }
    .instruccion { font-size: 1.8rem; color: #7f8c8d; margin-bottom: 40px; }

    /* ENTRADA DE TEXTO GIGANTE */
    input[type="text"] {
      width: 100%;
      padding: 35px;
      font-size: 3rem;
      text-align: center;
      border: 5px solid var(--gris-claro);
      border-radius: 25px;
      box-sizing: border-box;
      outline: none;
      background-color: var(--gris-claro);
      color: var(--grosella-negra);
      font-weight: bold;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--naranja);
      background-color: #fff;
      box-shadow: 0 0 30px rgba(239, 59, 51, 0.2);
    }

    /* PANTALLA DE RESULTADOS */
    .display-precio {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nombre-producto { font-size: 3.5rem; color: var(--grosella-negra); margin: 0; font-weight: 800; line-height: 1; }
    .precio-producto { font-size: 11rem; color: var(--rojo-intenso); margin: 10px 0; font-weight: 900; }

    /* LISTA DE COINCIDENCIAS */
    .contenedor-coincidencias {
      display: none;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .item-coincidencia {
      background: var(--gris-claro);
      padding: 25px;
      margin-bottom: 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-volver {
      background-color: var(--grosella-negra);
      margin-top: 30px;
      width: 100%;
      padding: 25px;
      font-size: 1.8rem;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    /* BOTÓN ADMIN INVISIBLE */
    .admin-gear { position: absolute; top: 10px; right: 10px; opacity: 0.02; background: none; border: none; font-size: 20px; cursor: pointer; }
    .status-bar { position: absolute; bottom: 10px; width: 100%; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    .oculto { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body onload="inicializarApp()">

  <button class="admin-gear" onclick="configurarCSV()">⚙️</button>
  <div id="statusLabel" class="status-bar">Sincronizando...</div>

  <div class="kiosko-container">
    
    <div id="pantallaCaptura">
      <h1>PRECIO</h1>
      <p class="instruccion">Escanee su producto</p>
      <input type="text" id="lectorEntrada" placeholder="..." autofocus autocomplete="off">
    </div>
    
    <div id="pantallaCoincidencias" class="contenedor-coincidencias">
      <div id="listaCoincidencias"></div>
    </div>
    
    <div id="pantallaResultado" class="display-precio"></div>
    
    <button id="btnVolver" class="oculto btn-volver" onclick="restablecerPantalla()">CERRAR</button>
  </div>

  <script>
    let productosRegistrados = {}; 
    let temporizadorRegreso = null;

    async function inicializarApp() {
      const url = localStorage.getItem('csv_master_url');
      if (!url) {
        alert("Configure el enlace CSV en el icono oculto superior.");
        return;
      }
      await cargarDesdeSheets(url);
      setInterval(() => cargarDesdeSheets(url), 1800000); 
    }

    function configurarCSV() {
      const url = prompt("Enlace CSV de Google Sheets:", localStorage.getItem('csv_master_url') || "");
      if (url) {
        localStorage.setItem('csv_master_url', url);
        location.reload();
      }
    }

    async function cargarDesdeSheets(url) {
      const statusLabel = document.getElementById("statusLabel");
      try {
        const cacheBuster = url + (url.includes('?') ? '&' : '?') + "t=" + new Date().getTime();
        const res = await fetch(cacheBuster);
        const data = await res.text();
        localStorage.setItem('cache_csv_data', data);
        procesarDatosCSV(data);
        statusLabel.innerText = "Actualizado: " + new Date().toLocaleTimeString();
      } catch (e) {
        const cache = localStorage.getItem('cache_csv_data');
        if (cache) procesarDatosCSV(cache);
        statusLabel.innerText = "Modo Offline";
      }
    }

    function procesarDatosCSV(data) {
      // Filtrar líneas vacías y saltar encabezado
      const filas = data.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
      productosRegistrados = {};
      
      filas.forEach(f => {
        const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
        if (c.length >= 4) { 
          const cod = c[0].replace(/"/g, '').trim().toLowerCase();
          // Limpiamos el precio de símbolos de moneda
          let precioLimpio = c[3].replace(/"/g, '').replace('$', '').trim();
          
          productosRegistrados[cod] = {
            nombre: c[1].replace(/"/g, '').trim(),
            precio: parseFloat(precioLimpio) || 0
          };
        }
      });
    }

    function accionVerificar() {
      const input = document.getElementById("lectorEntrada");
      const valor = input.value.trim().toLowerCase();
      if (!valor) return;

      let coincidencias = [];
      // Búsqueda exacta
      if (productosRegistrados[valor]) {
        coincidencias.push(productosRegistrados[valor]);
      } else {
        // Búsqueda por nombre
        for (const cod in productosRegistrados) {
          if (productosRegistrados[cod].nombre.toLowerCase().includes(valor)) {
            coincidencias.push(productosRegistrados[cod]);
          }
        }
      }

      document.getElementById("pantallaCaptura").classList.add("oculto");
      document.getElementById("btnVolver").classList.remove("oculto");

      if (coincidencias.length === 1) {
        mostrarPrecio(coincidencias[0]);
      } else if (coincidencias.length > 1) {
        mostrarOpciones(coincidencias);
      } else {
        document.getElementById("pantallaResultado").style.display = "block";
        document.getElementById("pantallaResultado").innerHTML = `<p style="font-size:3rem; color:var(--rojo-intenso);">NO ENCONTRADO</p>`;
        iniciarAutoLimpieza();
      }
      input.value = "";
    }

    function mostrarPrecio(prod) {
      const resDiv = document.getElementById("pantallaResultado");
      resDiv.style.display = "block";
      resDiv.innerHTML = `
        <p class="nombre-producto">${prod.nombre}</p>
        <p class="precio-producto">$${prod.precio.toFixed(2)}</p>
      `;
      iniciarAutoLimpieza();
    }

    function mostrarOpciones(lista) {
      const pOpc = document.getElementById("pantallaCoincidencias");
      const listaDiv = document.getElementById("listaCoincidencias");
      pOpc.style.display = "block";
      listaDiv.innerHTML = `<p style="text-align:center; font-size:1.2rem; color:gray;">Varios encontrados:</p>`;
      
      lista.slice(0, 4).forEach(prod => { // Limitamos a 4 para no romper el diseño
        const div = document.createElement("div");
        div.className = "item-coincidencia";
        div.innerHTML = `<span>${prod.nombre}</span> <b>$${prod.precio.toFixed(2)}</b>`;
        div.onclick = () => {
          pOpc.style.display = "none";
          mostrarPrecio(prod);
        };
        listaDiv.appendChild(div);
      });
      iniciarAutoLimpieza();
    }

    function iniciarAutoLimpieza() {
      if (temporizadorRegreso) clearTimeout(temporizadorRegreso);
      temporizadorRegreso = setTimeout(restablecerPantalla, 8000); // 8 segundos
    }

    function restablecerPantalla() {
      if (temporizadorRegreso) clearTimeout(temporizadorRegreso);
      document.getElementById("pantallaResultado").style.display = "none";
      document.getElementById("pantallaCoincidencias").style.display = "none";
      document.getElementById("btnVolver").classList.add("oculto");
      document.getElementById("pantallaCaptura").classList.remove("oculto");
      document.getElementById("lectorEntrada").focus();
    }

    document.getElementById("lectorEntrada").addEventListener("keypress", (e) => {
      if (e.key === "Enter") accionVerificar();
    });

    // Enfoque forzado
    document.body.addEventListener("click", () => {
      const pantallaCaptura = document.getElementById("pantallaCaptura");
      if (!pantallaCaptura.classList.contains("oculto")) {
        document.getElementById("lectorEntrada").focus();
      }
    });
  </script>
</body>
</html>
